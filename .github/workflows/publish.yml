name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Version is single-sourced in src/covia/__init__.py (pyproject reads
          # it dynamically via [tool.hatch.version]).
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/covia/__init__.py)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v${TAG} does not match __version__ ${VERSION} in src/covia/__init__.py"
            exit 1
          fi
          echo "Tag v${TAG} matches __version__ ${VERSION}"

  build:
    needs: [ci, validate-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED_VERSION="$EXPECTED_VERSION" python -c "import os, covia; assert covia.__version__ == os.environ['EXPECTED_VERSION']"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
