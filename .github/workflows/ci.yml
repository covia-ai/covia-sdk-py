name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,signing]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check --diff src/ tests/

      - name: Type check
        run: mypy src/covia/

      - name: Unit tests
        run: pytest tests/unit --cov=covia --cov-report=xml -v

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  integration:
    runs-on: ubuntu-latest
    # Run integration tests against the public test venue on pushes and
    # manual dispatch. PRs from forks skip (no trusted network).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,signing]"

      - name: Integration tests
        env:
          COVIA_VENUE_URL: https://venue-3.covia.ai
        run: pytest -m integration -v -rs
