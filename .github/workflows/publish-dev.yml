name: Publish Dev to TestPyPI

on:
  push:
    branches: [develop]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Patch version with dev suffix
        run: |
          # Version is dynamic — hatchling reads __version__ from __init__.py
          # (see [tool.hatch.version] in pyproject.toml), so patch it there.
          BASE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/covia/__init__.py)
          if [ -z "$BASE" ]; then echo "Could not read __version__" >&2; exit 1; fi
          DEV_VERSION="${BASE}.dev${{ github.run_number }}"
          echo "DEV_VERSION=${DEV_VERSION}" >> "$GITHUB_ENV"
          sed -i "s/^__version__ = \".*\"/__version__ = \"${DEV_VERSION}\"/" src/covia/__init__.py
          echo "Patched version to ${DEV_VERSION}"

      - name: Build package
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
