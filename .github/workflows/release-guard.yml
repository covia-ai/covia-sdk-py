name: Release branch guard

# Fails unless `master` points exactly at the latest final-release tag (vX.Y.Z).
# This prevents both a stale release branch and unreleased commits on master.

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  master-is-latest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0   # full history + tags for ancestry check

      - name: Ensure master equals the latest final-release tag
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "No final-release (vX.Y.Z) tags yet — nothing to check."
            exit 0
          fi
          if [ "$(git rev-parse "${LATEST}^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "OK: master points exactly at the latest release tag ${LATEST}."
          else
            echo "::error::master must point exactly at ${LATEST}. Fast-forward master to the release tag and keep unreleased work on develop."
            exit 1
          fi
