[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "covia"
version = "0.1.0"
description = "Python SDK for the Covia federated AI orchestration grid"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Covia", email = "dev@covia.ai" },
]
keywords = ["covia", "ai", "orchestration", "federated", "grid", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "httpx-sse>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://covia.ai"
Documentation = "https://docs.covia.ai/sdk/python"
Repository = "https://github.com/covia-ai/covia-sdk-py"
Changelog = "https://github.com/covia-ai/covia-sdk-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/covia-ai/covia-sdk-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/covia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a live venue (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["covia"]
omit = ["tests/*"]
